[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-tools"
version = "0.1.0"
description = "Project-scoped agent tools for iOS, analytics, Cloudflare and encrypted credentials"
requires-python = ">=3.11"
dependencies = ["cryptography>=44,<49", "boto3>=1.35,<2", "tomlkit>=0.13,<1"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
test = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
workflow-tools = "workflow_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workflow_tools = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
